name: Release

# Publish a release on GitHub (Releases > Draft a new release, tag like v0.1.0) and this
# builds the app and attaches the .exe files to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      DISKPARTPLUS_INTEGRATION: '1'
      DOTNET_NOLOGO: '1'
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test DiskpartPlus.slnx --configuration Release

      - name: Publish x64 and ARM64
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/DiskpartPlus.App/DiskpartPlus.App.csproj `
              --configuration Release --runtime $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=$version --output "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "publish/$rid/DiskpartPlus.exe" "DiskpartPlus-$version-$rid.exe"
          }

      - name: Attach to the release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          gh release upload $env:TAG "DiskpartPlus-$version-win-x64.exe" "DiskpartPlus-$version-win-arm64.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Fill in the notes if the release was published without any.
          $body = gh release view $env:TAG --json body --jq .body
          if ([string]::IsNullOrWhiteSpace($body)) {
            gh release edit $env:TAG --notes-file docs/RELEASE_NOTES.md
          }
