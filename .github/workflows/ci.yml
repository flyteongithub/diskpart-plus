name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DiskpartPlus.slnx

      - name: Build
        run: dotnet build DiskpartPlus.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DiskpartPlus.slnx --configuration Release --no-build --verbosity normal
